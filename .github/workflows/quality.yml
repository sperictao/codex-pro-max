name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install
      - name: Install Linux dependencies
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            echo "apt-get attempt ${attempt}/3"
            if timeout 240 sudo apt-get update && timeout 300 sudo apt-get install -y \
              libwebkit2gtk-4.1-dev \
              libgtk-3-dev \
              libappindicator3-dev \
              librsvg2-dev \
              patchelf; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "apt failed or timed out, retrying in 30s..."
              sleep 30
            else
              exit 1
            fi
          done
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Ensure taskboard resource dirs exist
        run: mkdir -p vendor/dashi-taskboard/dist/web
      - name: Build bundled dsh plugins
        run: pnpm run build:dsh-plugins
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml
