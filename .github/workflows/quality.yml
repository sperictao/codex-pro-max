name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # check:contracts regenerates the contract with `cargo run`, so this job needs the
      # same Tauri build prerequisites as the rust job: the vendored taskboard resources
      # referenced by tauri.conf.json and the Linux WebKit/GTK toolchain.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Ensure taskboard resource dirs exist
        run: mkdir -p vendor/dashi-taskboard/dist/web
      - run: npm run check:contracts
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Ensure taskboard resource dirs exist
        run: mkdir -p vendor/dashi-taskboard/dist/web
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
      - name: Compile Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-run
      - name: Test
        run: node scripts/run-rust-tests.mjs --manifest-path src-tauri/Cargo.toml --timeout 60
      - name: Check generated Guard contracts
        run: npm run check:contracts

  rust-msrv-targeted:
    name: rust-msrv-targeted-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: msrv-1.89.0
      - name: Ensure taskboard resource dirs exist
        run: npm run ensure:taskboard
      - name: Test updater build wrapper
        run: node scripts/test-build-updater.mjs
      - name: Test Rust runner
        run: npm run test:rust-runner
      - name: Verify locked dependency graph
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --locked --no-deps --format-version 1
      - name: Check all Rust targets
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets --locked
      - name: Compile Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-run
      - name: Run all Rust tests
        run: node scripts/run-rust-tests.mjs --manifest-path src-tauri/Cargo.toml --timeout 60
      - name: Run Guard paths contract target
        run: node scripts/run-rust-tests.mjs --manifest-path src-tauri/Cargo.toml --test guard_paths_contract --timeout 60
      - name: Run Guard atomic store target
        run: node scripts/run-rust-tests.mjs --manifest-path src-tauri/Cargo.toml --test guard_atomic_store --timeout 60
      - name: Run Guard transaction recovery target
        run: node scripts/run-rust-tests.mjs --manifest-path src-tauri/Cargo.toml --test guard_transaction_recovery --timeout 60
      - name: Run Guard batch contract target
        run: node scripts/run-rust-tests.mjs --manifest-path src-tauri/Cargo.toml --test guard_batch_contract --timeout 60
      - name: Run Guard state migration target
        run: node scripts/run-rust-tests.mjs --manifest-path src-tauri/Cargo.toml --test guard_state_migration --timeout 60
      - name: Run Guard command registry contract target
        run: node scripts/run-rust-tests.mjs --manifest-path src-tauri/Cargo.toml --test guard_command_registry --timeout 60
      - name: Run Guard role capability target
        run: node scripts/run-rust-tests.mjs --manifest-path src-tauri/Cargo.toml --test guard_roles_capability --timeout 60
      - name: Run Guard role migration target
        run: node scripts/run-rust-tests.mjs --manifest-path src-tauri/Cargo.toml --test guard_role_migration --timeout 60
      - name: Run Guard runtime audit target
        run: node scripts/run-rust-tests.mjs --manifest-path src-tauri/Cargo.toml --test guard_runtime_audit --timeout 60
      - name: Run Guard operation audit target
        run: node scripts/run-rust-tests.mjs --manifest-path src-tauri/Cargo.toml --test guard_operation_audit --timeout 60
      - name: Run Guard format parser target
        run: node scripts/run-rust-tests.mjs --manifest-path src-tauri/Cargo.toml --filter codex_guard::format --timeout 60
      - name: Check generated Guard contracts
        run: npm run check:contracts
