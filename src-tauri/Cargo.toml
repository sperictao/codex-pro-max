[package]
name = "dashi-taskboard-launcher"
version = "0.1.2"
description = "One-click launcher for dashi-taskboard integrated with Codex"
authors = ["dashi-taskboard-launcher"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"

[features]
custom-protocol = ["tauri/custom-protocol"]
