[package]
name = "codex-pro-max"
version = "1.18.0"
description = "One-click launcher for dashi-taskboard integrated with Codex"
authors = ["codex-pro-max"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
tokio = { version = "1", features = ["full"] }
log = "0.4"
sys-locale = "0.3"
# taskboard v0.2.3 instance token 模式：token 生成（uuid v4）与 /health challenge 的 HMAC-SHA256 proof 校验
uuid = { version = "1", features = ["v4"] }
hmac = "0.12"
sha2 = "0.10"
# dsh web 启动等待：unix 侧 kill(pid,0) 探活（进程已死则提前带日志报错，不干等超时）
libc = "0.2"

# 商店版应用 COM 激活（版本与 tauri 依赖树中的 windows 0.61.3 对齐）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_Foundation", "Win32_Storage_Packaging_Appx", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
