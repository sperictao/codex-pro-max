[package]
name = "dashi-taskboard-launcher"
version = "0.6.2"
description = "One-click launcher for dashi-taskboard integrated with Codex"
authors = ["dashi-taskboard-launcher"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
tokio = { version = "1", features = ["full"] }
log = "0.4"

# 商店版应用 COM 激活（版本与 tauri 依赖树中的 windows 0.61.3 对齐）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_Foundation", "Win32_Storage_Packaging_Appx"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
