<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashi Taskboard Launcher</title>
    <style>
      :root {
        --bg-primary: #0d1117;
        --bg-secondary: #161b22;
        --bg-tertiary: #21262d;
        --bg-hover: #30363d;
        --border: #30363d;
        --text-primary: #e6edf3;
        --text-secondary: #8b949e;
        --text-muted: #6e7681;
        --accent: #2f81f7;
        --accent-hover: #388bfd;
        --green: #3fb950;
        --red: #f85149;
        --yellow: #d29922;
        --orange: #db6d28;
        --radius: 8px;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        height: 100vh;
        overflow: hidden;
        user-select: none;
      }

      .app {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      /* 顶部标题栏 */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 24px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-secondary);
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      .logo .accent { color: var(--accent); }

      .header-right {
        display: flex;
        gap: 8px;
      }

      .header-btn {
        padding: 6px 14px;
        border: 1px solid var(--border);
        background: var(--bg-tertiary);
        color: var(--text-secondary);
        border-radius: var(--radius);
        cursor: pointer;
        font-size: 13px;
        transition: all 0.15s;
      }

      .header-btn:hover {
        background: var(--bg-hover);
        color: var(--text-primary);
      }

      .header-btn.active {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* 主内容区 */
      .main {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
      }

      /* 状态卡片 */
      .status-section {
        margin-bottom: 24px;
      }

      .section-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 12px;
      }

      .status-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .status-card {
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        transition: border-color 0.2s;
      }

      .status-card:hover {
        border-color: var(--bg-hover);
      }

      .status-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .status-card-title {
        font-size: 15px;
        font-weight: 600;
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 500;
      }

      .status-badge .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }

      .status-badge.running { background: rgba(63,185,80,0.15); color: var(--green); }
      .status-badge.running .dot { background: var(--green); }
      .status-badge.stopped { background: rgba(110,118,129,0.15); color: var(--text-muted); }
      .status-badge.stopped .dot { background: var(--text-muted); }
      .status-badge.starting { background: rgba(210,153,34,0.15); color: var(--yellow); }
      .status-badge.starting .dot { background: var(--yellow); animation: pulse 1s infinite; }
      .status-badge.stopping { background: rgba(210,153,34,0.15); color: var(--yellow); }
      .status-badge.stopping .dot { background: var(--yellow); }
      .status-badge.failed { background: rgba(248,81,73,0.15); color: var(--red); }
      .status-badge.failed .dot { background: var(--red); }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }

      .status-message {
        font-size: 13px;
        color: var(--text-secondary);
        margin-bottom: 12px;
        font-family: "SF Mono", "Fira Code", monospace;
      }

      .status-actions {
        display: flex;
        gap: 8px;
      }

      .btn {
        padding: 8px 16px;
        border: none;
        border-radius: var(--radius);
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition: all 0.15s;
      }

      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .btn-primary {
        background: var(--accent);
        color: white;
      }

      .btn-primary:hover:not(:disabled) {
        background: var(--accent-hover);
      }

      .btn-danger {
        background: rgba(248,81,73,0.15);
        color: var(--red);
        border: 1px solid rgba(248,81,73,0.3);
      }

      .btn-danger:hover:not(:disabled) {
        background: rgba(248,81,73,0.25);
      }

      .btn-secondary {
        background: var(--bg-tertiary);
        color: var(--text-primary);
        border: 1px solid var(--border);
      }

      .btn-secondary:hover:not(:disabled) {
        background: var(--bg-hover);
      }

      /* 主操作区 */
      .action-bar {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
      }

      .btn-large {
        flex: 1;
        padding: 14px 24px;
        font-size: 15px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      /* 配置面板 */
      .config-panel {
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
      }

      .config-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }

      .config-row:last-child {
        margin-bottom: 0;
      }

      .config-label {
        width: 140px;
        font-size: 13px;
        color: var(--text-secondary);
        flex-shrink: 0;
      }

      .config-input {
        flex: 1;
        padding: 8px 12px;
        background: var(--bg-tertiary);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text-primary);
        font-size: 13px;
        font-family: inherit;
        outline: none;
        transition: border-color 0.15s;
      }

      .config-input:focus {
        border-color: var(--accent);
      }

      .config-input.path-input {
        font-family: "SF Mono", "Fira Code", monospace;
        font-size: 12px;
      }

      .config-browse {
        padding: 8px 12px;
        background: var(--bg-tertiary);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 13px;
        white-space: nowrap;
      }

      .config-browse:hover {
        background: var(--bg-hover);
        color: var(--text-primary);
      }

      .config-validate {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 4px;
      }

      .config-validate.ok { color: var(--green); }
      .config-validate.err { color: var(--red); }

      .config-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .toggle-switch {
        position: relative;
        width: 40px;
        height: 22px;
        background: var(--bg-tertiary);
        border-radius: 11px;
        cursor: pointer;
        transition: background 0.2s;
      }

      .toggle-switch.active {
        background: var(--accent);
      }

      .toggle-switch::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        background: white;
        border-radius: 50%;
        transition: transform 0.2s;
      }

      .toggle-switch.active::after {
        transform: translateX(18px);
      }

      .toggle-label {
        font-size: 13px;
        color: var(--text-secondary);
      }

      /* Skill 安装 */
      .skill-section {
        margin-top: 16px;
        padding: 16px;
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }

      .skill-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      .skill-title {
        font-size: 14px;
        font-weight: 600;
      }

      .skill-desc {
        font-size: 12px;
        color: var(--text-muted);
        margin-bottom: 12px;
      }

      /* Toast */
      .toast-container {
        position: fixed;
        bottom: 24px;
        right: 24px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 1000;
      }

      .toast {
        padding: 12px 20px;
        border-radius: var(--radius);
        font-size: 13px;
        max-width: 400px;
        animation: slideIn 0.2s ease;
      }

      .toast.success { background: rgba(63,185,80,0.15); color: var(--green); border: 1px solid rgba(63,185,80,0.3); }
      .toast.error { background: rgba(248,81,73,0.15); color: var(--red); border: 1px solid rgba(248,81,73,0.3); }
      .toast.info { background: rgba(47,129,247,0.15); color: var(--accent); border: 1px solid rgba(47,129,247,0.3); }

      @keyframes slideIn {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }

      /* 隐藏的设置面板 */
      .settings-hidden { display: none; }

      /* 健康检查指示器 */
      .health-indicator {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <div class="header-left">
          <div class="logo">Dashi<span class="accent">Taskboard</span> Launcher</div>
        </div>
        <div class="header-right">
          <button class="header-btn" id="btn-settings" onclick="toggleSettings()">设置</button>
          <button class="header-btn" id="btn-skill" onclick="toggleSkill()">Codex Skill</button>
        </div>
      </div>

      <div class="main">
        <!-- 主操作区 -->
        <div class="action-bar">
          <button class="btn btn-primary btn-large" id="btn-start-all" onclick="startAll()">
            一键启动
          </button>
          <button class="btn btn-danger btn-large" id="btn-stop-all" onclick="stopAll()" disabled>
            全部停止
          </button>
        </div>

        <!-- 状态卡片 -->
        <div class="status-section">
          <div class="section-title">服务状态</div>
          <div class="status-grid">
            <div class="status-card">
              <div class="status-card-header">
                <div class="status-card-title">Taskboard 服务</div>
                <div class="status-badge stopped" id="badge-taskboard">
                  <span class="dot"></span>
                  <span>已停止</span>
                </div>
              </div>
              <div class="status-message" id="msg-taskboard">未启动</div>
              <div class="status-actions">
                <button class="btn btn-secondary" id="btn-start-tb" onclick="startTaskboard()">启动</button>
                <button class="btn btn-secondary" id="btn-stop-tb" onclick="stopTaskboard()" disabled>停止</button>
                <button class="btn btn-secondary" id="btn-open-tb" onclick="openTaskboard()" disabled>打开</button>
              </div>
            </div>

            <div class="status-card">
              <div class="status-card-header">
                <div class="status-card-title">Codex 注入器</div>
                <div class="status-badge stopped" id="badge-injector">
                  <span class="dot"></span>
                  <span>已停止</span>
                </div>
              </div>
              <div class="status-message" id="msg-injector">未启动</div>
              <div class="status-actions">
                <button class="btn btn-secondary" id="btn-start-inj" onclick="startInjector()">启动</button>
                <button class="btn btn-secondary" id="btn-stop-inj" onclick="stopInjector()" disabled>停止</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 设置面板 -->
        <div class="config-panel settings-hidden" id="settings-panel">
          <div class="section-title">配置</div>

          <div class="config-row">
            <div class="config-label">Taskboard 路径</div>
            <input type="text" class="config-input path-input" id="cfg-path" placeholder="/path/to/dashi-taskboard" oninput="onConfigChange()" />
            <button class="config-browse" onclick="browsePath()">浏览</button>
            <span class="config-validate" id="validate-path"></span>
          </div>

          <div class="config-row">
            <div class="config-label">Node.js 路径</div>
            <input type="text" class="config-input path-input" id="cfg-node" placeholder="留空则使用 PATH 中的 node" oninput="onConfigChange()" />
            <button class="config-browse" onclick="browseNode()">浏览</button>
            <span class="config-validate" id="validate-node"></span>
          </div>

          <div class="config-row">
            <div class="config-label">Codex 应用路径</div>
            <input type="text" class="config-input path-input" id="cfg-codex" placeholder="/Applications/ChatGPT.app" oninput="onConfigChange()" />
            <button class="config-browse" onclick="browseCodex()">浏览</button>
            <span class="config-validate" id="validate-codex"></span>
          </div>

          <div class="config-row">
            <div class="config-label">Taskboard 端口</div>
            <input type="number" class="config-input" id="cfg-port" value="47823" oninput="onConfigChange()" style="max-width: 120px;" />
          </div>

          <div class="config-row">
            <div class="config-label">CDP 调试端口</div>
            <input type="number" class="config-input" id="cfg-cdp" value="9231" oninput="onConfigChange()" style="max-width: 120px;" />
          </div>

          <div class="config-row">
            <div class="config-label">启动模式</div>
            <div class="config-toggle">
              <div class="toggle-switch active" id="toggle-mode" onclick="toggleMode()"></div>
              <span class="toggle-label" id="toggle-mode-label">独立窗口模式（不重启 Codex）</span>
            </div>
          </div>

          <div style="margin-top: 16px;">
            <button class="btn btn-primary" onclick="saveConfig()">保存配置</button>
          </div>
        </div>

        <!-- Skill 安装面板 -->
        <div class="skill-section settings-hidden" id="skill-panel">
          <div class="skill-header">
            <div class="skill-title">Codex Skill 安装</div>
          </div>
          <div class="skill-desc">
            将 manage-taskboard Skill 安装到 ~/.codex/skills/ 目录，让 Codex Agent 能自动管理看板任务。
          </div>
          <button class="btn btn-primary" onclick="installSkill()">安装 Skill</button>
          <div id="skill-result" style="margin-top: 8px; font-size: 12px; color: var(--text-secondary);"></div>
        </div>
      </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
