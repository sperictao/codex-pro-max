<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashi Taskboard Launcher</title>
    <style>
      /* ============ Geist Design Variables ============ */
      :root {
        --background: #ffffff;
        --foreground: #171717;
        --card: #ffffff;
        --border: hsl(0 0% 92%);
        --muted: hsl(0 0% 96%);
        --muted-foreground: hsl(0 0% 40%);
        --interactive: hsl(215 100% 50%);
        --interactive-hover: hsl(217 100% 46%);
        --destructive: hsl(347 100% 49%);
        --success: hsl(135 62% 41%);
        --warning: hsl(39 100% 50%);
        --radius-sm: 6px;
        --radius-md: 12px;
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        --font-mono: "SF Mono", "Fira Code", ui-monospace, monospace;
        --ease-geist: cubic-bezier(0.175, 0.885, 0.32, 1.1);
        --shadow-sm: 0 2px 2px rgba(0, 0, 0, 0.04);
      }

      .dark {
        --background: #000000;
        --foreground: #ededed;
        --card: #0a0a0a;
        --border: hsl(0 0% 15%);
        --muted: hsl(0 0% 10%);
        --muted-foreground: hsl(0 0% 63%);
        --interactive: hsl(214 100% 50%);
        --destructive: hsl(355 89% 57%);
        --success: hsl(138 100% 29%);
        --warning: hsl(39 100% 46%);
      }

      /* ============ Reset ============ */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font-sans);
        background: var(--background);
        color: var(--foreground);
        height: 100vh;
        overflow: hidden;
        user-select: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .hidden {
        display: none !important;
      }

      .mono {
        font-family: var(--font-mono);
      }

      /* ============ App Layout ============ */
      .app {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      /* ============ Header ============ */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 24px;
        border-bottom: 1px solid var(--border);
        background: var(--background);
        flex-shrink: 0;
      }

      .logo {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.3px;
        color: var(--foreground);
      }

      .header-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .header-btn {
        padding: 6px 14px;
        border: 1px solid var(--border);
        background: var(--background);
        color: var(--muted-foreground);
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-size: 13px;
        font-family: var(--font-sans);
        font-weight: 500;
        transition: all 150ms var(--ease-geist);
      }

      .header-btn:hover {
        background: var(--muted);
        color: var(--foreground);
      }

      .header-btn.active {
        color: var(--interactive);
        border-color: var(--interactive);
      }

      /* ============ Main View ============ */
      .main-view {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
      }

      .action-bar {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
      }

      .btn-large {
        flex: 1;
        padding: 14px 24px;
        font-size: 15px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      /* ============ Status Section ============ */
      .section-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted-foreground);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 12px;
      }

      .status-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .status-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 20px;
        box-shadow: var(--shadow-sm);
        transition: border-color 150ms var(--ease-geist);
      }

      .status-card:hover {
        border-color: var(--muted-foreground);
      }

      .status-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .status-card-title {
        font-size: 15px;
        font-weight: 600;
        color: var(--foreground);
      }

      .status-message {
        font-size: 12px;
        color: var(--muted-foreground);
        margin-bottom: 16px;
        min-height: 16px;
        word-break: break-all;
      }

      .status-actions {
        display: flex;
        gap: 8px;
      }

      /* ============ Status Badge ============ */
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 500;
      }

      .status-badge .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }

      .status-badge.running {
        background: hsl(135 62% 41% / 0.1);
        color: var(--success);
      }
      .status-badge.running .dot {
        background: var(--success);
      }
      .status-badge.stopped {
        background: var(--muted);
        color: var(--muted-foreground);
      }
      .status-badge.stopped .dot {
        background: var(--muted-foreground);
      }
      .status-badge.starting {
        background: hsl(39 100% 50% / 0.1);
        color: var(--warning);
      }
      .status-badge.starting .dot {
        background: var(--warning);
        animation: pulse 1s infinite;
      }
      .status-badge.stopping {
        background: hsl(39 100% 50% / 0.1);
        color: var(--warning);
      }
      .status-badge.stopping .dot {
        background: var(--warning);
      }
      .status-badge.failed {
        background: hsl(347 100% 49% / 0.1);
        color: var(--destructive);
      }
      .status-badge.failed .dot {
        background: var(--destructive);
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      /* ============ Buttons ============ */
      .btn {
        padding: 8px 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        font-family: var(--font-sans);
        transition: all 150ms var(--ease-geist);
        background: var(--background);
        color: var(--foreground);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .btn-primary {
        background: var(--interactive);
        color: #ffffff;
        border-color: var(--interactive);
      }

      .btn-primary:hover:not(:disabled) {
        background: var(--interactive-hover);
        border-color: var(--interactive-hover);
      }

      .btn-secondary {
        background: var(--background);
        color: var(--foreground);
        border-color: var(--border);
      }

      .btn-secondary:hover:not(:disabled) {
        background: var(--muted);
      }

      .btn-danger {
        background: var(--background);
        color: var(--destructive);
        border-color: var(--border);
      }

      .btn-danger:hover:not(:disabled) {
        background: hsl(347 100% 49% / 0.08);
        border-color: var(--destructive);
      }

      .btn-sm {
        padding: 6px 12px;
        font-size: 12px;
      }

      /* ============ Settings View ============ */
      .settings-view {
        flex: 1;
        display: flex;
        overflow: hidden;
      }

      .settings-sidebar {
        width: 200px;
        border-right: 1px solid var(--border);
        padding: 16px 0;
        flex-shrink: 0;
      }

      .nav-item {
        display: block;
        width: 100%;
        padding: 10px 20px;
        border: none;
        background: none;
        color: var(--muted-foreground);
        font-size: 14px;
        font-weight: 500;
        font-family: var(--font-sans);
        text-align: left;
        cursor: pointer;
        transition: all 150ms var(--ease-geist);
      }

      .nav-item:hover {
        background: var(--muted);
        color: var(--foreground);
      }

      .nav-item.active {
        color: var(--interactive);
        background: hsl(215 100% 50% / 0.08);
      }

      .settings-content {
        flex: 1;
        overflow-y: auto;
        padding: 24px 32px;
        display: flex;
        flex-direction: column;
      }

      .section-heading {
        font-size: 18px;
        font-weight: 600;
        color: var(--foreground);
        margin-bottom: 24px;
      }

      .settings-section {
        flex: 1;
      }

      /* ============ Config Rows ============ */
      .config-row {
        margin-bottom: 20px;
      }

      .config-label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: var(--foreground);
        margin-bottom: 6px;
      }

      .config-input-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .config-input {
        flex: 1;
        padding: 8px 12px;
        background: var(--background);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--foreground);
        font-size: 13px;
        font-family: var(--font-sans);
        outline: none;
        transition: border-color 150ms var(--ease-geist);
      }

      .config-input:focus {
        border-color: var(--interactive);
      }

      .config-input.mono {
        font-family: var(--font-mono);
        font-size: 12px;
      }

      .config-validate {
        font-size: 12px;
        font-family: var(--font-mono);
        white-space: nowrap;
      }

      .config-validate.ok {
        color: var(--success);
      }

      .config-validate.err {
        color: var(--destructive);
      }

      /* ============ Toggle Switch ============ */
      .config-toggle {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .toggle-switch {
        position: relative;
        width: 40px;
        height: 22px;
        background: var(--border);
        border-radius: 11px;
        cursor: pointer;
        transition: background 150ms var(--ease-geist);
        flex-shrink: 0;
      }

      .toggle-switch.active {
        background: var(--interactive);
      }

      .toggle-switch::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        background: #ffffff;
        border-radius: 50%;
        transition: transform 150ms var(--ease-geist);
      }

      .toggle-switch.active::after {
        transform: translateX(18px);
      }

      .toggle-label {
        font-size: 13px;
        color: var(--muted-foreground);
      }

      /* ============ Skill Install ============ */
      .skill-install-area {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .skill-result {
        font-size: 12px;
        color: var(--muted-foreground);
        min-height: 16px;
        word-break: break-all;
      }

      /* ============ About Section ============ */
      .about-row {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 0;
        border-bottom: 1px solid var(--border);
      }

      .about-row:last-child {
        border-bottom: none;
      }

      .about-label {
        font-size: 13px;
        color: var(--muted-foreground);
        min-width: 120px;
      }

      .about-value {
        font-size: 13px;
        color: var(--foreground);
      }

      .about-value.mono {
        font-family: var(--font-mono);
      }

      .about-link {
        color: var(--interactive);
        text-decoration: none;
        font-size: 13px;
        cursor: pointer;
      }

      .about-link:hover {
        text-decoration: underline;
      }

      .health-status {
        font-size: 12px;
        font-family: var(--font-mono);
      }

      .health-status.ok {
        color: var(--success);
      }

      .health-status.err {
        color: var(--destructive);
      }

      /* ============ Settings Footer ============ */
      .settings-footer {
        padding-top: 20px;
        border-top: 1px solid var(--border);
        margin-top: 20px;
        display: flex;
        justify-content: flex-end;
      }

      /* ============ Toast ============ */
      .toast-container {
        position: fixed;
        bottom: 24px;
        right: 24px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 1000;
      }

      .toast {
        padding: 12px 20px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        max-width: 400px;
        background: var(--card);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-sm);
        color: var(--foreground);
        animation: slideIn 150ms var(--ease-geist);
      }

      .toast.success {
        border-left: 3px solid var(--success);
      }
      .toast.error {
        border-left: 3px solid var(--destructive);
      }
      .toast.info {
        border-left: 3px solid var(--interactive);
      }

      @keyframes slideIn {
        from {
          transform: translateX(100%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- ============ Header ============ -->
      <header class="header">
        <div class="logo">Dashi Taskboard Launcher</div>
        <div class="header-actions">
          <button class="header-btn" id="btn-settings" onclick="toggleSettings()">设置</button>
          <button class="header-btn" id="btn-skill" onclick="showSkill()">Skill</button>
          <button class="header-btn" id="btn-theme" onclick="toggleTheme()">
            <span id="theme-label">系统</span>
          </button>
        </div>
      </header>

      <!-- ============ Main View ============ -->
      <main class="main-view" id="main-view">
        <!-- Action Bar -->
        <div class="action-bar">
          <button class="btn btn-primary btn-large" id="btn-start-all" onclick="startAll()">
            一键启动
          </button>
          <button class="btn btn-danger btn-large" id="btn-stop-all" onclick="stopAll()" disabled>
            全部停止
          </button>
        </div>

        <!-- Status Grid -->
        <div class="section-title">服务状态</div>
        <div class="status-grid">
          <!-- Taskboard Card -->
          <div class="status-card">
            <div class="status-card-header">
              <div class="status-card-title">Taskboard 服务</div>
              <div class="status-badge stopped" id="badge-taskboard">
                <span class="dot"></span>
                <span id="badge-taskboard-text">已停止</span>
              </div>
            </div>
            <div class="status-message mono" id="msg-taskboard">未启动</div>
            <div class="status-actions">
              <button class="btn btn-secondary btn-sm" id="btn-start-tb" onclick="startTaskboard()">启动</button>
              <button class="btn btn-secondary btn-sm" id="btn-stop-tb" onclick="stopTaskboard()" disabled>停止</button>
              <button class="btn btn-secondary btn-sm" id="btn-open-tb" onclick="openTaskboard()" disabled>打开</button>
            </div>
          </div>

          <!-- Injector Card -->
          <div class="status-card">
            <div class="status-card-header">
              <div class="status-card-title">Codex 注入器</div>
              <div class="status-badge stopped" id="badge-injector">
                <span class="dot"></span>
                <span id="badge-injector-text">已停止</span>
              </div>
            </div>
            <div class="status-message mono" id="msg-injector">未启动</div>
            <div class="status-actions">
              <button class="btn btn-secondary btn-sm" id="btn-start-inj" onclick="startInjector()">启动</button>
              <button class="btn btn-secondary btn-sm" id="btn-stop-inj" onclick="stopInjector()" disabled>停止</button>
            </div>
          </div>
        </div>
      </main>

      <!-- ============ Settings View ============ -->
      <main class="settings-view hidden" id="settings-view">
        <!-- Sidebar -->
        <nav class="settings-sidebar">
          <button class="nav-item active" id="nav-general" onclick="switchSection('general')">通用</button>
          <button class="nav-item" id="nav-network" onclick="switchSection('network')">网络</button>
          <button class="nav-item" id="nav-mode" onclick="switchSection('mode')">模式</button>
          <button class="nav-item" id="nav-about" onclick="switchSection('about')">关于</button>
        </nav>

        <!-- Content -->
        <div class="settings-content">
          <!-- General Section -->
          <section class="settings-section" id="section-general">
            <h2 class="section-heading">通用</h2>

            <div class="config-row">
              <label class="config-label" for="cfg-path">Taskboard 路径</label>
              <div class="config-input-group">
                <input type="text" class="config-input mono" id="cfg-path" placeholder="/path/to/dashi-taskboard" oninput="onConfigChange()" />
                <button class="btn btn-secondary btn-sm" onclick="browsePath()">浏览</button>
                <button class="btn btn-secondary btn-sm" id="btn-use-bundled" onclick="useBundledTaskboard()">使用内置</button>
                <span class="config-validate" id="validate-path"></span>
              </div>
            </div>

            <div class="config-row">
              <label class="config-label" for="cfg-node">Node.js 路径</label>
              <div class="config-input-group">
                <input type="text" class="config-input mono" id="cfg-node" placeholder="留空则使用 PATH 中的 node" oninput="onConfigChange()" />
                <button class="btn btn-secondary btn-sm" onclick="browseNode()">浏览</button>
                <span class="config-validate" id="validate-node"></span>
              </div>
            </div>

            <div class="config-row">
              <label class="config-label" for="cfg-codex">Codex 应用路径</label>
              <div class="config-input-group">
                <input type="text" class="config-input mono" id="cfg-codex" placeholder="/Applications/ChatGPT.app" oninput="onConfigChange()" />
                <button class="btn btn-secondary btn-sm" onclick="browseCodex()">浏览</button>
                <span class="config-validate" id="validate-codex"></span>
              </div>
            </div>
          </section>

          <!-- Network Section -->
          <section class="settings-section hidden" id="section-network">
            <h2 class="section-heading">网络</h2>

            <div class="config-row">
              <label class="config-label" for="cfg-host">Taskboard 主机地址</label>
              <input type="text" class="config-input mono" id="cfg-host" value="127.0.0.1" oninput="onConfigChange()" />
            </div>

            <div class="config-row">
              <label class="config-label" for="cfg-port">Taskboard 端口</label>
              <input type="number" class="config-input mono" id="cfg-port" value="47823" oninput="onConfigChange()" style="max-width: 200px;" />
            </div>

            <div class="config-row">
              <label class="config-label" for="cfg-cdp">CDP 调试端口</label>
              <input type="number" class="config-input mono" id="cfg-cdp" value="9231" oninput="onConfigChange()" style="max-width: 200px;" />
            </div>
          </section>

          <!-- Mode Section -->
          <section class="settings-section hidden" id="section-mode">
            <h2 class="section-heading">模式</h2>

            <div class="config-row">
              <label class="config-label">启动模式</label>
              <div class="config-toggle">
                <div class="toggle-switch active" id="toggle-mode" onclick="toggleMode()"></div>
                <span class="toggle-label" id="toggle-mode-label">独立窗口模式（不重启 Codex）</span>
              </div>
            </div>

            <div class="config-row">
              <label class="config-label">自动打开浏览器</label>
              <div class="config-toggle">
                <div class="toggle-switch active" id="toggle-auto-open" onclick="toggleAutoOpen()"></div>
                <span class="toggle-label" id="toggle-auto-open-label">启动时自动打开浏览器</span>
              </div>
            </div>

            <div class="config-row">
              <label class="config-label">Codex Skill 安装</label>
              <div class="skill-install-area">
                <button class="btn btn-primary btn-sm" id="btn-install-skill" onclick="installSkill()">安装 Skill</button>
                <div class="skill-result mono" id="skill-result"></div>
              </div>
            </div>
          </section>

          <!-- About Section -->
          <section class="settings-section hidden" id="section-about">
            <h2 class="section-heading">关于</h2>

            <div class="about-row">
              <span class="about-label">应用版本</span>
              <span class="about-value mono" id="about-version">-</span>
            </div>

            <div class="about-row">
              <span class="about-label">更新源状态</span>
              <span class="about-value" id="updater-health">检查中...</span>
            </div>

            <div class="about-row">
              <span class="about-label"></span>
              <button class="btn btn-secondary btn-sm" id="btn-check-update" onclick="checkUpdate()">检查更新</button>
            </div>

            <div class="about-row">
              <span class="about-label">GitHub</span>
              <a class="about-link" id="link-github" onclick="openGithub(); return false;">在浏览器中打开</a>
            </div>
          </section>

          <!-- Save Footer -->
          <div class="settings-footer" id="settings-footer">
            <button class="btn btn-primary" id="btn-save-config" onclick="saveConfig()">保存配置</button>
          </div>
        </div>
      </main>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
