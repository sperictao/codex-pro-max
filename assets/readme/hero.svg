<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
  <title id="title">Codex Pro Max</title>
  <desc id="desc">Tauri v2 desktop launcher that manages the dashi-taskboard service, injects a panel into the Codex desktop app, guards ~/.codex configuration, integrates FastCtx, exposes DeepSeek Harness over Tailscale HTTPS, and self-updates. The right panel shows the launcher's own home screen with one status row per managed component.</desc>

  <rect x="1" y="1" width="1198" height="398" rx="24" fill="#0D1117" stroke="#21262D" stroke-width="1.5"/>

  <!-- title block -->
  <g transform="translate(56 0)">
    <text x="0" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" letter-spacing="3" fill="#58A6FF">TAURI V2 · MACOS / WINDOWS / LINUX</text>
    <text x="0" y="140" font-size="54" font-weight="700" fill="#E6EDF3">Codex Pro</text>
    <text x="0" y="204" font-size="54" font-weight="700" fill="#58A6FF">Max</text>
    <text x="0" y="256" font-size="20" fill="#C9D1D9">A desktop GUI instead of hand-typed</text>
    <text x="0" y="286" font-size="20" fill="#C9D1D9">commands for your Codex setup.</text>
    <text x="0" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#8B949E">SERVICE · CDP INJECT · GUARD · FASTCTX · DSH · UPDATE</text>
  </g>

  <!-- divider -->
  <line x1="648" y1="44" x2="648" y2="368" stroke="#21262D" stroke-width="1.5"/>

  <!-- launcher home window (product proof) -->
  <g transform="translate(668 44)">
    <rect x="0" y="0" width="476" height="324" rx="14" fill="#161B22" stroke="#3D444D" stroke-width="1.5"/>

    <!-- title bar -->
    <line x1="0" y1="44" x2="476" y2="44" stroke="#21262D" stroke-width="1.5"/>
    <circle cx="20" cy="22" r="4.5" fill="#FF5F57"/>
    <circle cx="44" cy="22" r="4.5" fill="#FEBC2E"/>
    <circle cx="68" cy="22" r="4.5" fill="#28C840"/>
    <text x="96" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#8B949E">codex-pro-max — launcher</text>

    <!-- rows: name + mono sublabel, one per managed component -->
    <g>
      <circle cx="26" cy="72" r="5" fill="#3FB950"/>
      <text x="46" y="68" font-size="20" font-weight="600" fill="#E6EDF3">Taskboard Service</text>
      <text x="46" y="89" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#8B949E">start / stop · health check</text>
      <line x1="20" y1="100" x2="456" y2="100" stroke="#21262D" stroke-width="1.5"/>
    </g>
    <g>
      <circle cx="26" cy="128" r="5" fill="#3FB950"/>
      <text x="46" y="124" font-size="20" font-weight="600" fill="#E6EDF3">Codex Injector</text>
      <text x="46" y="145" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#8B949E">CDP panel injection</text>
      <line x1="20" y1="156" x2="456" y2="156" stroke="#21262D" stroke-width="1.5"/>
    </g>
    <g>
      <circle cx="26" cy="184" r="5" fill="#3FB950"/>
      <text x="46" y="180" font-size="20" font-weight="600" fill="#E6EDF3">Config Guard</text>
      <text x="46" y="201" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#8B949E">~/.codex · drift watch</text>
      <line x1="20" y1="212" x2="456" y2="212" stroke="#21262D" stroke-width="1.5"/>
    </g>
    <g>
      <circle cx="26" cy="240" r="5" fill="#3FB950"/>
      <text x="46" y="236" font-size="20" font-weight="600" fill="#E6EDF3">FastCtx</text>
      <text x="46" y="257" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#8B949E">MCP runtime · integrate</text>
      <line x1="20" y1="268" x2="456" y2="268" stroke="#21262D" stroke-width="1.5"/>
    </g>
    <g>
      <circle cx="26" cy="296" r="5" fill="#3FB950"/>
      <text x="46" y="292" font-size="20" font-weight="600" fill="#E6EDF3">dsh Remote Access</text>
      <text x="46" y="313" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#8B949E">Tailscale HTTPS · :3899</text>
    </g>
  </g>
</svg>
